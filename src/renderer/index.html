<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:">
<title>AI Task Assistant</title>
<script>
  // "Glass" mode = the window sits on Windows acrylic, so surfaces are translucent and the window fills itself.
  if (new URLSearchParams(location.search).get('glass') === '1') document.documentElement.classList.add('glass');
</script>
<style>
  /*
   * Ledger: paper and ink. A serif for what you read, mono for keys and statuses, one vermilion accent.
   * Falls back to solid paper; in glass mode the surfaces turn translucent over Windows acrylic.
   */
  :root {
    color-scheme: light dark;
    --display: "Segoe UI Variable Display", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace;
    --ink: #1b1a17;  --ink-2: #4f4b42;  --ink-3: #6b675d;
    --rule: rgba(27, 26, 23, .14);  --rule-2: rgba(27, 26, 23, .3);
    --accent: #c8401e;  --on-ink: #fcfbf7;  --sel: rgba(27, 26, 23, .07);
    --bg: #fcfbf7;  --layer: #ffffff;  --foot: #f4f1e9;
    --prog: #1f4e8c;  --done: #2f6b3a;  --warn: #8a4b00;  --bad: #a8321a;
    --shadow: 0 12px 28px rgba(60, 48, 20, .22), 0 1px 2px rgba(60, 48, 20, .2);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f2efe7;  --ink-2: #cbc6b9;  --ink-3: #a8a396;
      --rule: rgba(242, 239, 231, .16);  --rule-2: rgba(242, 239, 231, .34);
      --accent: #ff8b67;  --on-ink: #1b1a17;  --sel: rgba(242, 239, 231, .1);
      --bg: #1c1b17;  --layer: #26251f;  --foot: #171612;
      --prog: #8db6f0;  --done: #7fd097;  --warn: #f0c36a;  --bad: #ff9b85;
      --shadow: 0 12px 28px rgba(0, 0, 0, .55), 0 1px 2px rgba(0, 0, 0, .5);
    }
  }
  /* Glass: translucent paper over the acrylic blur. Kept fairly opaque so text stays readable on any wallpaper. */
  html.glass { --bg: rgba(252, 251, 247, .74); --layer: rgba(255, 255, 255, .55); --foot: rgba(244, 241, 233, .55); --rule: rgba(27, 26, 23, .16); }
  @media (prefers-color-scheme: dark) {
    html.glass { --bg: rgba(26, 25, 21, .68); --layer: rgba(255, 255, 255, .06); --foot: rgba(0, 0, 0, .22); }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  /* Without glass, 16px of padding is room for the CSS shadow (the window is transparent). */
  body { padding: 16px; font: 14px/20px var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; user-select: none; }
  input { user-select: text; }
  html.glass body { padding: 0; }

  #shell { position: relative; max-width: 668px; margin: 0 auto; background: var(--bg); border: 1px solid var(--rule); border-radius: 6px; box-shadow: var(--shadow); overflow: hidden; }
  html.glass #shell { max-width: none; margin: 0; border-radius: 0; border: 0; box-shadow: none; }

  #bar { -webkit-app-region: drag; display: flex; align-items: center; gap: 14px; height: 60px; padding: 0 12px 0 20px; }
  .prompt { font: 600 19px/1 var(--mono); color: var(--accent); flex: none; }
  /* The prompt blinks while a request is running, like a terminal waiting on a command. */
  #shell.busy .prompt { animation: blink 1s steps(1, end) infinite; }
  @keyframes blink { 50% { opacity: .15; } }
  #input { -webkit-app-region: no-drag; flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font: 400 18px/24px var(--display); caret-color: var(--accent); caret-shape: block; }
  #input::placeholder { color: var(--ink-3); }
  .kbd { display: inline-flex; align-items: center; justify-content: center; height: 20px; min-width: 20px; padding: 0 6px; font: 500 11px/1 var(--mono); color: var(--ink-2); border: 1px solid var(--rule-2); border-radius: 3px; flex: none; }
  #toggle { -webkit-app-region: no-drag; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 4px; background: transparent; color: var(--ink-2); cursor: pointer; }
  #toggle:hover { background: var(--sel); }
  #toggle svg { transition: transform .15s; }
  #toggle[aria-expanded='true'] svg { transform: rotate(180deg); }
  #toggle:focus-visible, .btn:focus-visible, .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* Indeterminate progress line along the bottom of the input bar while a request is running. */
  #prog { position: absolute; left: 0; right: 0; top: 59px; height: 2px; overflow: hidden; opacity: 0; transition: opacity .15s; pointer-events: none; }
  #prog::before { content: ''; position: absolute; top: 0; height: 100%; width: 26%; background: var(--accent); animation: slide 1.15s cubic-bezier(.4, 0, .2, 1) infinite; }
  #shell.busy #prog { opacity: 1; }
  @keyframes slide { from { left: -26%; } to { left: 100%; } }

  #out { border-top: 1px solid var(--rule); padding: 14px 20px 16px; display: flex; flex-direction: column; gap: 14px; max-height: min(470px, var(--out-max, 470px)); overflow-y: auto; }
  /* --out-max comes from the main process (how much screen is left below the window), never from the
     window's own height: that would shrink the window as its content shrinks, in a loop. */
  #out[hidden], #foot[hidden] { display: none; }
  #out::-webkit-scrollbar { width: 10px; }
  #out::-webkit-scrollbar-thumb { background: var(--rule-2); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }

  .label { font: 500 11px/16px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 4px 8px; }
  .echo { display: flex; align-items: baseline; gap: 10px; font: 400 14px/20px var(--sans); color: var(--ink-2); }
  .echo::before { content: ">"; font: 600 13px/1 var(--mono); color: var(--accent); flex: none; }
  .meta { font-size: 13px; line-height: 18px; color: var(--ink-3); }
  .draft { font: 400 11.5px/18px var(--mono); color: var(--ink-2); }
  .draft b { font-weight: 400; color: var(--ink-3); }
  .draft span + span::before { content: '/'; margin: 0 9px; color: var(--ink-3); }
  .q-text { font: 600 16px/22px var(--sans); margin: 0 0 4px 8px; }

  /* The assistant's own words: help, analysis, and why it chose what it chose. */
  .assist { display: flex; flex-direction: column; gap: 10px; }
  .say { font: 400 15px/22px var(--sans); }
  .why { display: flex; align-items: baseline; gap: 10px; font-size: 13px; line-height: 19px; color: var(--ink-2); }
  .why .stamp { font: 600 10.5px/14px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); border: 1px solid var(--rule-2); border-radius: 2px; padding: 0 6px; flex: none; }
  .sug { display: flex; flex-wrap: wrap; gap: 8px; }
  .sug .btn { height: 30px; padding: 0 12px; font-weight: 500; }

  /* Ledger rows: dotted rules, a mono key, a serif title. */
  .opts { display: flex; flex-direction: column; }
  .opt { display: flex; align-items: baseline; gap: 14px; padding: 10px 8px; border-bottom: 1px dotted var(--rule-2); cursor: pointer; }
  .opt:last-child { border-bottom: 0; }
  .opt:hover { background: var(--sel); }
  .opt.sel { background: var(--sel); }
  .opt.sel .t { font-weight: 500; }
  .opt .n { font: 600 12px/1 var(--mono); width: 56px; flex: none; color: var(--ink-2); }
  .opt.sel .n { color: var(--accent); }
  .opt .t { flex: 1; min-width: 0; font: 400 15px/22px var(--sans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .opt .d { font-size: 12px; color: var(--ink-3); flex: none; }

  /* The ticket slip. */
  .slip { border-top: 3px double var(--ink); padding-top: 12px; }
  .slip h4 { margin: 0 0 6px; font: 600 16px/22px var(--sans); }
  .props { margin: 0; }
  .signin-code { font: 600 24px/1.3 var(--mono); letter-spacing: 0.08em; user-select: all; margin: 4px 0 2px; }
  .props .r { display: flex; align-items: baseline; gap: 14px; padding: 7px 0; border-bottom: 1px dotted var(--rule-2); }
  .props .r:last-child { border-bottom: 0; }
  .props dt { width: 104px; flex: none; font: 400 12px/22px var(--mono); text-transform: lowercase; color: var(--ink-3); }
  .props dd { margin: 0; flex: 1; font: 400 15px/22px var(--sans); overflow-wrap: anywhere; white-space: pre-wrap; }
  .tag { margin-left: 10px; font: 600 10.5px/14px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--warn); border: 1px solid currentColor; border-radius: 2px; padding: 0 6px; }

  /* Notes: a labelled box, like a margin note on a printed slip. */
  .note { display: flex; align-items: baseline; gap: 12px; padding: 8px 12px; border: 1px solid var(--rule-2); border-radius: 3px; background: var(--layer); }
  .note .stamp { font: 600 10.5px/14px var(--mono); letter-spacing: .06em; text-transform: uppercase; border: 1px solid currentColor; border-radius: 2px; padding: 0 6px; flex: none; }
  .note.warn .stamp { color: var(--warn); } .note.bad .stamp { color: var(--bad); }
  .note.ok .stamp { color: var(--done); }
  .note a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--accent); margin-left: 12px; }

  .actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .btn { height: 34px; padding: 0 16px; font: 600 14px/1 var(--sans); color: var(--ink); background: transparent; border: 1px solid var(--ink); border-radius: 4px; cursor: pointer; }
  .btn:hover { background: var(--sel); }
  .btn.primary { color: var(--on-ink); background: var(--ink); }
  .btn.primary:hover { filter: brightness(1.18); }
  .btn.quiet { border-color: transparent; font-weight: 500; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }

  .done { border-top: 3px double var(--ink); padding-top: 12px; display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 14px; }
  .done .stamp { font: 600 10.5px/14px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--done); border: 1px solid currentColor; border-radius: 2px; padding: 1px 6px; }
  .done .k { font: 600 15px/22px var(--mono); }
  .done a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--accent); }

  #foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; white-space: nowrap; height: 34px; padding: 0 20px; border-top: 1px solid var(--rule); background: var(--foot); color: var(--ink-2); font: 400 11px/1 var(--mono); }
  #pills, #keys { display: flex; align-items: center; gap: 16px; min-width: 0; }
  #pills { overflow: hidden; }
  #pills .d { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--bad); }
  #pills .d.ok { background: var(--done); }
  #pills .warnnote { color: var(--warn); }
  #keys span { display: inline-flex; align-items: center; gap: 6px; }
  #keys .kbd { height: 18px; font-size: 10px; }
</style>
</head>
<body>
<div id="shell">
  <div id="bar">
    <span class="prompt" aria-hidden="true">&gt;</span>
    <input id="input" type="text" autocomplete="off" spellcheck="false" placeholder="Describe a task or a problem" aria-label="Request">
    <span class="kbd" id="kb">Esc</span>
    <button id="toggle" type="button" aria-label="Show suggestions and recent tickets" aria-expanded="false" title="Suggestions (Down arrow)">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6l4.5 4.5L12.5 6"/></svg>
    </button>
  </div>
  <div id="prog"></div>
  <div id="out" hidden aria-live="polite"></div>
  <div id="foot" hidden><div id="pills"></div><div id="keys"></div></div>
</div>
<script>
const GLASS = document.documentElement.classList.contains('glass');
const PAD = GLASS ? 0 : 16;
const input = document.getElementById('input');
const out = document.getElementById('out');
const foot = document.getElementById('foot');
const shell = document.getElementById('shell');
const kb = document.getElementById('kb');
const toggle = document.getElementById('toggle');
const DEFAULT_PLACEHOLDER = input.placeholder;
const LABELS = { project: 'Project', issuetype: 'Type', summary: 'Summary', priority: 'Priority', assignee: 'Assignee', components: 'Component', description: 'Description', labels: 'Labels', parent: 'Parent' };
const label = k => LABELS[k] || (k.charAt(0).toUpperCase() + k.slice(1));

// Inside the desktop window the preload bridge exists; in a plain browser fall back to HTTP.
const bridge = window.api;
const post = path => body => fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).then(r => r.json());
const transport = bridge
  ? { send: m => bridge.send(m), connections: () => bridge.connections(), audit: () => bridge.audit() }
  : { send: post('/api/message'), connections: () => fetch('/api/connections').then(r => r.json()), audit: () => fetch('/api/audit').then(r => r.json()) };

let busy = false;
let pending = null;     // the question waiting for an answer
let questionEl = null;
let draftEl = null;
let cardAct = null;     // what Enter does while a confirmation card is showing
let opts = [];          // selectable rows for the current screen: { el, run }
let sel = -1;
let suggestOpen = false;

function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const kid of kids) if (kid) e.append(typeof kid === 'string' ? document.createTextNode(kid) : kid);
  return e;
}
const kbd = t => el('span', { class: 'kbd', text: t });

function show() { out.hidden = false; foot.hidden = false; }
function reset() {
  out.replaceChildren(); out.hidden = true; foot.hidden = true;
  pending = null; questionEl = null; draftEl = null; cardAct = null; opts = []; sel = -1; suggestOpen = false;
  toggle.setAttribute('aria-expanded', 'false'); input.placeholder = DEFAULT_PLACEHOLDER; hint();
}
function add(node) { show(); out.append(node); out.scrollTop = out.scrollHeight; return node; }
function setBusy(b) { busy = b; shell.classList.toggle('busy', b); }

function setOpts(list) { opts = list; sel = list.length ? 0 : -1; paint(); }
function paint() { opts.forEach((o, i) => o.el.classList.toggle('sel', i === sel)); if (opts[sel]) opts[sel].el.scrollIntoView({ block: 'nearest' }); hint(); }
function move(d) { if (!opts.length) return; sel = (sel + d + opts.length) % opts.length; paint(); }

// The footer always says what the keys do right now.
function hint() {
  kb.textContent = input.value.trim() ? 'Enter' : 'Esc';
  const keys = pending ? [['↑↓', 'choose'], ['Enter', 'select'], ['Esc', 'close']]
    : cardAct ? [['Enter', 'create'], ['Esc', 'close']]
    : suggestOpen ? [['↑↓', 'move'], ['Enter', 'use'], ['Esc', 'close']]
    : [['Enter', 'send'], ['Esc', 'close']];
  document.getElementById('keys').replaceChildren(...keys.map(([a, b]) => el('span', {}, kbd(a), b)));
}

async function send(msg) {
  setBusy(true);
  try {
    const msgs = await transport.send(msg);
    if (!Array.isArray(msgs)) note('bad', 'Error', (msgs && msgs.error) || 'Something went wrong.');
    else for (const m of msgs) render(m);
  } catch (e) {
    note('bad', 'Error', String(e && e.message || e));
  }
  setBusy(false);
  input.focus();
}

// A labelled margin note: kind is ok, warn or bad.
function note(kind, stamp, text) { return add(el('div', { class: 'note ' + kind }, el('span', { class: 'stamp', text: stamp }), el('span', { text }))); }

// Start a new turn with a given sentence, as if it had been typed (used by the suggestion buttons).
function follow(text) {
  if (busy) return;
  reset();
  add(el('div', { class: 'echo', text }));
  send({ type: 'submit', text });
}

function renderAssistant(m) {
  const box = el('div', { class: 'assist' }, el('div', { class: 'say', text: m.text }));
  if (m.reasoning) box.append(el('div', { class: 'why' }, el('span', { class: 'stamp', text: 'Why' }), el('span', { text: m.reasoning })));
  if (m.suggestions && m.suggestions.length) box.append(el('div', { class: 'sug' }, ...m.suggestions.map(s => el('button', { class: 'btn', type: 'button', text: s, onclick: () => follow(s) }))));
  add(box);
}

function render(m) {
  if (m.type === 'assistant') renderAssistant(m);
  else if (m.type === 'info') add(el('div', { class: 'meta', text: m.text }));
  else if (m.type === 'error') note('bad', 'Error', m.message);
  else if (m.type === 'draft') renderDraft(m);
  else if (m.type === 'question') renderQuestion(m.question);
  else if (m.type === 'card') renderCard(m);
  else if (m.type === 'result') renderResult(m);
  else if (m.type === 'signin') renderSignin(m);
}

function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).catch(() => {});
}

// A sign-in in progress: the service's page is in the browser (or a code to enter there). The window then
// waits for the core to report the result; it may be hidden meanwhile and shows the result when reopened.
function renderSignin(m) {
  clearQuestion();
  const box = el('div', { class: 'slip' }, el('h4', { text: 'Sign in to ' + m.service }), el('div', { class: 'say', text: m.text }),
    m.code ? el('div', { class: 'signin-code', text: m.code }) : null);
  const row = el('div', { class: 'actions', style: 'margin-top:10px' });
  if (m.url) row.append(el('button', { class: 'btn primary', type: 'button', text: m.code ? 'Copy code and open the page' : 'Open the sign-in page',
    onclick: () => { if (m.code) copyText(m.code); window.open(m.url, '_blank', 'noopener'); } }));
  // These run while the wait is still open, so they go straight to the core instead of through send().
  const direct = msg => { box.remove(); transport.send(msg).then(msgs => { if (Array.isArray(msgs)) msgs.forEach(render); }); };
  if (m.alt) row.append(el('button', { class: 'btn', type: 'button', text: m.alt.label, onclick: () => direct({ type: 'answer', choiceId: m.alt.id }) }));
  row.append(el('button', { class: 'btn quiet', type: 'button', text: 'Cancel', onclick: () => direct({ type: 'cancel' }) }));
  box.append(row);
  add(box);
  setTimeout(() => send({ type: 'wait' }).then(() => box.remove()), 0);
}

// Lets the tray start a command (e.g. Connect… runs /connect) as if it had been typed.
window.runCommand = text => follow(text);

function renderDraft(m) {
  if (draftEl) draftEl.remove();
  if (!m.rows.length) { draftEl = null; return; }
  // A short summary line: long fields (a description) are left for the slip, and the rest are trimmed.
  const short = v => { const one = v.replace(/\s+/g, ' ').trim(); return one.length > 44 ? one.slice(0, 43) + '…' : one; };
  draftEl = el('div', { class: 'draft' }, ...m.rows.filter(r => !['description', 'body', 'message', 'notes'].includes(r.field)).map(r => el('span', {}, el('b', { text: label(r.field).toLowerCase() + ' ' }), short(r.value) + (r.assumed ? ' (assumed)' : ''))));
  show();
  out.insertBefore(draftEl, questionEl && questionEl.isConnected ? questionEl : null);
}

function answerWith(choice) {
  add(el('div', { class: 'echo', text: choice.label }));
  clearQuestion();
  send({ type: 'answer', choiceId: choice.id });
}
function clearQuestion() { if (questionEl) questionEl.remove(); questionEl = null; pending = null; opts = []; sel = -1; input.placeholder = DEFAULT_PLACEHOLDER; hint(); }

function renderQuestion(q) {
  clearQuestion();
  pending = q;
  input.placeholder = q.choices.length ? 'Choose an option or type an answer' : 'Type your answer';
  const rows = q.choices.map((c, i) => {
    const row = el('div', { class: 'opt', role: 'button', tabindex: '-1' }, el('span', { class: 'n', text: String(i + 1) }), el('span', { class: 't', text: c.label }), c.detail ? el('span', { class: 'd', text: c.detail }) : null);
    const run = () => answerWith(c);
    row.addEventListener('click', run);
    return { el: row, run };
  });
  questionEl = el('div', {}, el('div', { class: 'q-text', text: q.text }), rows.length ? el('div', { class: 'opts' }, ...rows.map(r => r.el)) : null,
    q.field.startsWith('__') ? null : el('div', { class: 'actions', style: 'margin-top:8px' }, el('button', { class: 'btn quiet', type: 'button', text: 'Skip the remaining questions', onclick: () => { add(el('div', { class: 'echo', text: 'Skip the remaining questions' })); clearQuestion(); send({ type: 'stop' }); } })));
  add(questionEl);
  setOpts(rows);
}

function renderCard(m) {
  clearQuestion();
  if (draftEl) { draftEl.remove(); draftEl = null; } // the slip shows the same values
  // A real issue or a message that can't be unsent needs a second press.
  const live = m.card.guard || m.card.warnings.some(w => /real issue/.test(w));
  const btnText = m.card.button || (live ? 'Create real ticket' : 'Create ticket');
  const props = el('dl', { class: 'props' });
  for (const r of m.card.rows) props.append(el('div', { class: 'r' }, el('dt', { text: r.title }), el('dd', {}, r.value, r.assumed ? el('span', { class: 'tag', text: 'assumed' }) : null)));
  const box = el('div', { style: 'display:flex;flex-direction:column;gap:12px' }, el('div', { class: 'slip' }, el('h4', { text: m.card.title || 'Create this ticket on ' + m.card.connectionName + '?' }), props));
  for (const w of m.card.warnings) box.append(el('div', { class: 'note warn' }, el('span', { class: 'stamp', text: /real issue/.test(w) ? 'Live' : 'Check' }), el('span', { text: w })));
  for (const e of m.errors) box.append(el('div', { class: 'note bad' }, el('span', { class: 'stamp', text: 'Error' }), el('span', { text: e })));
  if (m.unresolved.length) box.append(el('div', { class: 'note bad' }, el('span', { class: 'stamp', text: 'Missing' }), el('span', { text: m.unresolved.join(', ') + '. No real value is available for it.' })));
  const row = el('div', { class: 'actions' });
  if (m.canConfirm) {
    // On a live site the first press only arms the button, so one stray click or Enter cannot create a real issue.
    const btn = el('button', { class: 'btn primary', type: 'button', text: btnText });
    const go = () => { box.remove(); cardAct = null; add(el('div', { class: 'echo', text: btnText })); send({ type: 'confirm' }); };
    const press = () => {
      if (!live || btn.dataset.armed) return go();
      btn.dataset.armed = '1'; btn.textContent = 'Press again to confirm';
      setTimeout(() => { delete btn.dataset.armed; btn.textContent = btnText; }, 4000);
    };
    btn.addEventListener('click', press);
    cardAct = press;
    row.append(btn);
  }
  if (m.options.includes('answer-one')) row.append(el('button', { class: 'btn', type: 'button', text: 'Answer that one', onclick: () => { box.remove(); cardAct = null; send({ type: 'fallback', option: 'answer-one' }); } }));
  if (m.options.includes('save-draft')) row.append(el('button', { class: 'btn', type: 'button', text: 'Save as draft', onclick: () => { box.remove(); cardAct = null; send({ type: 'fallback', option: 'save-draft' }); } }));
  row.append(el('button', { class: 'btn quiet', type: 'button', text: 'Cancel', onclick: () => { box.remove(); cardAct = null; hint(); send({ type: 'cancel' }); } }));
  box.append(row);
  add(box); hint();
}

function renderResult(m) {
  clearQuestion(); cardAct = null; hint();
  if (!m.ok) { note('bad', 'Not done', m.text); return; }
  const key = m.stamp ? m.text : (m.text.match(/[A-Z][A-Z0-9]+-\d+/) || [m.text])[0];
  add(el('div', { class: 'done' }, el('span', { class: 'stamp', text: m.stamp || 'Created' }), el('span', { class: 'k', text: key }),
    m.url ? el('a', { href: m.url, target: '_blank', rel: 'noopener', text: m.linkText || 'Open in Jira' }) : null));
  // Follow-ups after a ticket (tell the reporter, post to the team): each starts its own request and card.
  if (m.suggestions && m.suggestions.length) add(el('div', { class: 'sug' }, ...m.suggestions.map(t => el('button', { class: 'btn', type: 'button', text: t, onclick: () => follow(t) }))));
}

// Suggestions and recent tickets, shown on demand (Down arrow or the chevron) so the window starts as a small bar.
async function showSuggestions() {
  if (busy || pending || cardAct) return;
  reset(); suggestOpen = true; toggle.setAttribute('aria-expanded', 'true');
  const [r, audit] = await Promise.all([transport.connections().catch(() => ({ examples: [] })), transport.audit().catch(() => [])]);
  const fill = text => () => { input.value = text; closeSuggestions(); input.focus(); hint(); };
  const mk = (key, text, detail, run) => { const row = el('div', { class: 'opt', role: 'button', tabindex: '-1' }, el('span', { class: 'n', text: key }), el('span', { class: 't', text }), detail ? el('span', { class: 'd', text: detail }) : null); row.addEventListener('click', run); return { el: row, run }; };
  const sug = (r.examples || []).slice(0, 3).map(t => mk('try', t, '', fill(t)));
  const recent = (audit || []).filter(a => a.result && a.result.ok && a.step && a.step.params && a.step.params.summary).slice(0, 3).map(a => mk(a.result.id, (a.step && a.step.params && a.step.params.summary) || '', a.connection, fill(`what is the status of ${a.result.id}`)));
  const wrap = el('div', {});
  if (sug.length) wrap.append(el('div', { class: 'label', text: 'Suggested' }), el('div', { class: 'opts' }, ...sug.map(s => s.el)));
  if (recent.length) wrap.append(el('div', { class: 'label', style: 'margin-top:12px', text: 'Recent tickets' }), el('div', { class: 'opts' }, ...recent.map(s => s.el)));
  if (!sug.length && !recent.length) wrap.append(el('div', { class: 'meta', text: 'Nothing to suggest yet.' }));
  add(wrap);
  setOpts([...sug, ...recent]);
  loadStatus();
}
function closeSuggestions() { if (suggestOpen) reset(); }

input.addEventListener('input', () => { if (suggestOpen) closeSuggestions(); hint(); });
toggle.addEventListener('click', () => { suggestOpen ? closeSuggestions() : showSuggestions(); input.focus(); });

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (busy) return;
    const text = input.value.trim();
    if (!text) { if (cardAct) cardAct(); else if (opts[sel]) opts[sel].run(); return; }
    input.value = ''; hint();
    if (pending) {
      add(el('div', { class: 'echo', text }));
      clearQuestion();
      send({ type: 'answer', text });
    } else {
      reset();
      add(el('div', { class: 'echo', text }));
      send({ type: 'submit', text });
    }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (opts.length) move(1); else if (!input.value && !busy) showSuggestions();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault(); move(-1);
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (suggestOpen) closeSuggestions(); else if (bridge) bridge.hide(); }
  // With an empty input, a digit picks the matching choice.
  if (pending && input.value === '' && /^[1-9]$/.test(e.key)) {
    const o = opts[Number(e.key) - 1];
    if (o) { e.preventDefault(); o.run(); }
  }
});

async function loadStatus() {
  try {
    const status = await transport.connections();
    document.getElementById('pills').replaceChildren(
      ...status.connections.map(c => el('span', { title: c.status.ok ? '' : c.status.error }, el('i', { class: 'd' + (c.status.ok ? ' ok' : '') }), c.name)),
      ...(status.autoCreate ? [el('span', { class: 'warnnote', text: 'auto-create on' })] : []),
      ...(status.llm ? [] : [el('span', { text: 'built-in rules (no AI model)' })]),
    );
  } catch { /* the footer is optional */ }
}

// Opening: a short fade and settle, nothing flashy.
function enter() {
  if (!shell.animate) return;
  shell.animate([{ opacity: 0, transform: 'translateY(-6px)' }, { opacity: 1, transform: 'none' }], { duration: 160, easing: 'cubic-bezier(0, 0, 0, 1)' });
}

// The desktop window follows the content: tell the main process how tall the palette is.
if (bridge) new ResizeObserver(() => bridge.resize(Math.ceil(shell.getBoundingClientRect().height) + 2 * PAD)).observe(shell);
if (bridge) bridge.onFocus(() => { enter(); input.focus(); input.select(); loadStatus(); });
// Room left on screen below the window: the results list scrolls inside it instead of running off the screen.
if (bridge && bridge.onAvail) bridge.onAvail(h => document.documentElement.style.setProperty('--out-max', Math.max(160, h - (GLASS ? 60 : 62) - 36 - 2 * PAD) + 'px'));
loadStatus(); hint(); input.focus();
</script>
</body>
</html>
